<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Eurovision Bingo — Pick your prompts</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="stylesheet" href="style.css" />
</head>
<body>
<div id="app">

  <header>
    <div class="wrap">
      <p class="eyebrow" id="pageEyebrow"></p>
      <div class="title-row">
        <h1 id="pageTitle"></h1>
        <div class="lang-toggle">
          <button type="button" data-lang="de" class="active">DE</button>
          <button type="button" data-lang="en">EN</button>
        </div>
      </div>

      <div class="scoreboard" id="scoreboard">
        <div class="scoreboard-top">
          <span class="scoreboard-label" id="scoreboardLabel"></span>
          <span class="scoreboard-count" id="scoreboardCount">0 / 24</span>
        </div>
        <div class="progress-track">
          <div class="progress-fill" id="progressFill"></div>
        </div>
      </div>

      <div class="name-field" id="nameField">
        <label id="nameLabel" for="nameInput"></label>
        <input type="text" id="nameInput" autocomplete="name" />
      </div>
    </div>
  </header>

  <main class="wrap">
    <div class="prompt-list" id="promptList">
      <div class="loading">Loading…</div>
    </div>

    <div class="closed-panel" id="closedPanel" hidden></div>

    <div class="predictions-form" id="predictionsForm" hidden></div>
  </main>

  <div class="submit-bar" id="submitBar">
    <div class="submit-inner">
      <button class="submit-btn" id="submitBtn" type="button" disabled></button>
      <div class="status-msg" id="statusMsg"></div>
    </div>
  </div>

</div>

<script src="script.js"></script>
</body>
</html>
